<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Torra Certa</title>
<meta name="description" content="Acompanhe o processamento caseiro de café, da colheita à xícara.">
<meta name="theme-color" content="#F7F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E140E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Torra Certa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="roast.css">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#F7F2EA; --card:#FBF8F3; --ink:#2B1D14; --ink2:#6E5A4B; --ink3:#A08C7C; --line:#E4D9CA;
  --harvest:#7E5E47; --pulp:#A87B5D; --ferment:#C29A6B; --crit:#B4452F; --dry:#D9893B; --test:#7A8A3E;
  --rest:#5E7A8C; --peel:#6B4A35; --roast:#4A2F1F; --degas:#A0755A; --done:#2B1D14;
  --field:#FFFFFF; --on-c:#FFFFFF; --scrim:rgba(43,29,20,.32); --shadow:rgba(43,29,20,.12);
  color-scheme:light;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --tab-h:58px;
}
/* ---------- modo escuro: fundo de café ---------- */
:root[data-theme="dark"] {
  --paper:#1E140E; --card:#2A1D15; --ink:#F3E9DC; --ink2:#C9B39D; --ink3:#937D6B; --line:#3E2D22;
  --harvest:#A88468; --pulp:#C49573; --ferment:#D6B285; --crit:#E2694D; --dry:#E9A04E; --test:#A6B75E;
  --rest:#82A3B8; --peel:#B07E5A; --roast:#94603F; --degas:#C79A80; --done:#F3E9DC;
  --field:#34251B; --on-c:#1E140E; --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#1E140E; --card:#2A1D15; --ink:#F3E9DC; --ink2:#C9B39D; --ink3:#937D6B; --line:#3E2D22;
    --harvest:#A88468; --pulp:#C49573; --ferment:#D6B285; --crit:#E2694D; --dry:#E9A04E; --test:#A6B75E;
    --rest:#82A3B8; --peel:#B07E5A; --roast:#94603F; --degas:#C79A80; --done:#F3E9DC;
    --field:#34251B; --on-c:#1E140E; --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--paper); }
/* sem zoom: só rolagem (bloqueia pinça e toque duplo) */
html, body { touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
button, [role=button], input, textarea, label { touch-action:manipulation; }
body {
  font-family:Inter, -apple-system, sans-serif; color:var(--ink); font-size:15px; line-height:1.4;
  font-feature-settings:"tnum" 1, "cv11" 1; -webkit-font-smoothing:antialiased;
  min-height:100dvh; overscroll-behavior-y:none;
}
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:inherit; }
input, textarea { font:inherit; color:inherit; }
.p-harvest{--c:var(--harvest)} .p-pulp{--c:var(--pulp)} .p-ferment{--c:var(--ferment)} .p-crit{--c:var(--crit)}
.p-dry{--c:var(--dry)} .p-test{--c:var(--test)} .p-rest{--c:var(--rest)} .p-peel{--c:var(--peel)}
.p-roast{--c:var(--roast)} .p-degas{--c:var(--degas)} .p-done{--c:var(--done)}

/* ---------- top bar ---------- */
.top {
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  padding:calc(var(--safe-t) + 10px) 20px 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.top.scrolled { border-bottom-color:var(--line); }
.lotbtn { display:flex; align-items:center; gap:5px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); font-weight:600; max-width:100%; }
.lotbtn span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lotbtn svg { width:12px; height:12px; stroke:var(--ink2); flex:none; }
.top h1 { font-family:Lora, serif; font-weight:600; font-size:28px; line-height:1.05; letter-spacing:-.01em; margin-top:3px; }
.top h1 em { font-style:italic; font-weight:500; color:var(--crit); }
.iconbtn { width:38px; height:38px; flex:none; border-radius:19px; display:grid; place-items:center; border:1px solid var(--line); background:var(--card); }
.iconbtn svg { width:19px; height:19px; stroke:var(--ink); }

main { padding:4px 16px calc(var(--tab-h) + var(--safe-b) + 24px); max-width:560px; margin:0 auto; }
.view { display:none; }
.view.on { display:block; animation:fade .22s ease; }
@keyframes fade { from { opacity:0; transform:translateY(4px); } }
.sec-title { font-family:Lora, serif; font-weight:600; font-size:19px; margin:26px 4px 10px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.sec-title small { font-family:Inter; font-size:12px; font-weight:500; color:var(--ink3); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
.card + .card { margin-top:12px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--c); flex:none; }

/* ---------- hero ---------- */
.hero { padding:18px 16px 16px; position:relative; overflow:hidden; }
.hero::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
.hero .when { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--c); }
.hero h2 { font-family:Lora, serif; font-weight:600; font-size:25px; line-height:1.1; margin-top:4px; }
.hero .sub { color:var(--ink2); font-size:13.5px; margin-top:3px; }
.est { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); border:1px solid var(--line); border-radius:4px; padding:1px 4px; margin-left:6px; vertical-align:2px; }
.track { margin-top:18px; }
.bar { position:relative; height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
.seg { position:absolute; top:0; bottom:0; background:var(--c); }
.bar-wrap { position:relative; }
.todaybar { position:absolute; top:-4px; bottom:-4px; width:0; border-left:2px solid var(--ink); }
.todaybar::after { content:""; position:absolute; top:-3px; left:-4px; width:6px; height:6px; border-radius:3px; background:var(--ink); }
.ticks { display:flex; justify-content:space-between; font-size:11px; color:var(--ink3); margin-top:6px; }
.ready { display:flex; gap:10px; align-items:flex-start; margin-top:14px; padding:11px 12px; border-radius:10px; font-size:13.5px; line-height:1.35; background:color-mix(in srgb, var(--test) 13%, var(--card)); }
.ready .dot { width:8px; height:8px; border-radius:4px; background:var(--test); margin-top:5px; flex:none; }
.actions { display:flex; gap:8px; margin-top:14px; }
.actions .btn { margin:0; }
.actions .back { flex:none; width:auto; padding:0 16px; }

/* ---------- stages list ---------- */
.stages { padding:6px 16px; }
.stg { display:flex; gap:12px; align-items:stretch; width:100%; }
.stg .rail { width:22px; flex:none; display:flex; flex-direction:column; align-items:center; }
.stg .node { width:22px; height:22px; border-radius:11px; border:2px solid var(--line); background:var(--card); display:grid; place-items:center; margin-top:10px; flex:none; }
.stg .node svg { width:12px; height:12px; stroke:var(--on-c); stroke-width:3.2; }
.stg .ln { flex:1; width:2px; background:var(--line); margin:3px 0 -10px; }
.stg:last-child .ln { visibility:hidden; }
.stg.past .node { background:var(--c); border-color:var(--c); }
.stg.past .ln { background:color-mix(in srgb, var(--c) 45%, var(--line)); }
.stg.cur .node { border-color:var(--c); box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.stg.cur .node::after { content:""; width:8px; height:8px; border-radius:4px; background:var(--c); }
.stg .body { flex:1; padding:10px 0 12px; display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); }
.stg:last-child .body { border-bottom:0; }
.stg .nm { font-size:15px; font-weight:500; }
.stg.cur .nm { font-weight:700; }
.stg.fut .nm { color:var(--ink2); }
.stg .dt { font-size:12.5px; color:var(--ink3); margin-top:1px; }
.stg .rt { font-size:12.5px; color:var(--ink3); text-align:right; white-space:nowrap; padding-top:2px; }
.stg.cur .rt { color:var(--c); font-weight:600; }

/* ---------- tasks ---------- */
.tasks { padding:4px 16px; }
.task { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
.task:last-child { border-bottom:0; }
.task .tl { flex:1; font-size:15px; line-height:1.3; }
.task .tl small { display:block; font-size:12.5px; color:var(--ink3); margin-top:2px; }
.task.done .tl { color:var(--ink3); }
.chk { width:26px; height:26px; flex:none; border-radius:8px; border:1.5px solid var(--ink3); display:grid; place-items:center; transition:all .15s; }
.chk svg { width:15px; height:15px; stroke:var(--on-c); stroke-width:3; opacity:0; }
.task.done .chk { background:var(--c, var(--ink)); border-color:var(--c, var(--ink)); }
.task.done .chk svg { opacity:1; }
.pips { display:flex; gap:6px; flex:none; }
.pip { width:22px; height:22px; border-radius:11px; border:1.5px solid var(--ink3); transition:all .15s; }
.pip.on { background:var(--c, var(--ink)); border-color:var(--c, var(--ink)); }
.go { flex:none; font-size:13px; font-weight:600; color:var(--c, var(--ink)); padding:6px 10px; border-radius:8px; background:color-mix(in srgb, var(--c, var(--ink)) 12%, var(--card)); }
.empty { padding:16px 0; color:var(--ink2); font-size:14.5px; }

/* ---------- tests ---------- */
.test { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); width:100%; }
.test:last-of-type { border-bottom:0; }
.tn { width:26px; height:26px; flex:none; border-radius:13px; border:1.5px solid var(--test); color:var(--test); font-size:12px; font-weight:700; display:grid; place-items:center; transition:all .15s; }
.test.on .tn { background:var(--test); color:var(--on-c); }
.test b { font-size:15px; font-weight:600; }
.test p { font-size:13px; color:var(--ink2); margin-top:2px; line-height:1.35; }
.btn { display:block; width:100%; text-align:center; padding:14px; border-radius:12px; background:var(--ink); color:var(--paper); font-weight:600; font-size:15px; margin-top:14px; }
.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
.btn.green { background:var(--test); }
.btn:disabled { opacity:.35; }
.hint { font-size:12.5px; color:var(--ink3); margin-top:8px; text-align:center; line-height:1.4; }

/* ---------- weight ---------- */
.wrow { display:flex; gap:10px; align-items:stretch; }
.field { flex:1; display:flex; align-items:center; border:1px solid var(--line); border-radius:12px; background:var(--field); padding:0 14px; }
.field input { flex:1; width:100%; border:0; outline:0; background:transparent; font-size:22px; font-weight:600; padding:12px 0; }
.field span { color:var(--ink3); font-size:15px; }
.wrow .btn { width:auto; margin:0; padding:0 22px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.stat { background:var(--paper); border-radius:10px; padding:10px; }
.stat .k { font-size:11px; color:var(--ink3); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.stat .v { font-size:19px; font-weight:600; margin-top:2px; }
.badge { display:flex; gap:10px; align-items:center; margin-top:12px; padding:11px 12px; border-radius:10px; font-size:13.5px; background:color-mix(in srgb, var(--test) 13%, var(--card)); }
.badge.warn { background:color-mix(in srgb, var(--dry) 15%, var(--card)); }
.chart { width:100%; height:auto; display:block; margin-top:6px; }
.wlist .wi { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:15px; }
.wlist .wi:last-child { border-bottom:0; }
.wi .d { width:76px; color:var(--ink2); }
.wi .g { flex:1; font-weight:600; }
.wi .pc { width:56px; text-align:right; color:var(--ink2); }
.wi .dl { width:64px; text-align:right; font-size:14px; color:var(--ink3); }
.wi .x { width:30px; text-align:right; color:var(--ink3); font-size:18px; }

/* ---------- calendar ---------- */
.legend { display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color:var(--ink2); margin:4px 4px 0; }
.lg { display:flex; align-items:center; gap:6px; }
.month { margin-top:22px; }
.month h3 { font-family:Lora, serif; font-weight:600; font-size:19px; margin:0 4px 8px; }
.month h3 span { font-family:Inter; font-weight:400; font-size:13px; color:var(--ink3); margin-left:4px; }
.grid { display:grid; grid-template-columns:repeat(7,1fr); row-gap:5px; }
.wd { font-size:11px; font-weight:600; color:var(--ink3); padding:0 0 4px 7px; }
.day { position:relative; display:block; cursor:pointer; height:64px; margin:0 2.5px; border-radius:10px; padding:6px; border:1px solid var(--line); background:var(--card); }
.day.blank { border:0; background:none; pointer-events:none; }
.day[data-p] { background:color-mix(in srgb, var(--c) 16%, var(--card)); border-color:color-mix(in srgb, var(--c) 38%, var(--card)); }
.day.strong { background:color-mix(in srgb, var(--c) 26%, var(--card)); }
.day.estd { background-image:repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--card) 55%, transparent) 5px 7px); }
.day.jl { margin-left:-.5px; border-top-left-radius:0; border-bottom-left-radius:0; border-left-color:transparent; }
.day.jr { margin-right:-.5px; border-top-right-radius:0; border-bottom-right-radius:0; border-right-color:transparent; }
.day .n { font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; margin:-3px 0 0 -3px; border-radius:11px; }
.day:not([data-p]) .n { color:var(--ink3); font-weight:500; }
.day.today .n { background:var(--ink); color:var(--paper); }
.day .mk { position:absolute; top:5px; right:5px; font-size:9px; color:var(--c, var(--ink)); }
.day .ms { position:absolute; left:5px; right:2px; bottom:5px; font-size:9px; font-weight:600; line-height:1.1; letter-spacing:-.01em; overflow:hidden; }
.day .dots { position:absolute; left:6px; bottom:6px; display:flex; gap:3px; }
.day .dots i { width:5px; height:5px; border-radius:3px; background:var(--ink2); }
.day:active { transform:scale(.97); }

/* ---------- guide ---------- */
.gcard { position:relative; padding:16px 16px 12px 26px; }
.gcard::before { content:""; position:absolute; left:12px; top:16px; bottom:16px; width:3px; border-radius:2px; background:var(--c); }
.gcard .cd { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--c); }
.gcard h4 { font-family:Lora, serif; font-size:18px; font-weight:600; margin-top:2px; }
.gcard ul { list-style:none; margin-top:8px; }
.gcard li { position:relative; font-size:14px; padding:5px 0 5px 16px; line-height:1.35; }
.gcard li::before { content:""; position:absolute; left:2px; top:12px; width:5px; height:5px; border-radius:3px; background:var(--ink3); }
.alert { background:color-mix(in srgb, var(--crit) 8%, var(--card)); border-color:color-mix(in srgb, var(--crit) 28%, var(--card)); }
.alert h4 { font-family:Lora, serif; font-size:18px; color:var(--crit); margin-bottom:6px; }
.alert p { font-size:14px; padding:6px 0; border-top:1px solid color-mix(in srgb, var(--crit) 18%, var(--card)); }
.alert p:first-of-type { border-top:0; }
.alert b { font-weight:600; }
.seg-ctl { display:flex; background:var(--line); border-radius:10px; padding:3px; margin:4px 0 0; }
.seg-ctl button { flex:1; text-align:center; padding:8px 4px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink2); }
.seg-ctl button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 2px var(--shadow); }

/* ---------- hoje: refinamentos ---------- */
.herotop { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.stagebtn { display:inline-flex; align-items:center; gap:2px; font-size:12px; font-weight:600; color:var(--ink2); padding:4px 6px 4px 10px; border:1px solid var(--line); border-radius:20px; white-space:nowrap; }
.stagebtn svg { width:14px; height:14px; }
.signs { padding:4px 16px; }
.signs .test:last-of-type { border-bottom:0; }
.test .tn svg { width:13px; height:13px; stroke:var(--on-c); stroke-width:3.2; }
.test.auto { cursor:default; }
.test.auto .tn { border-style:dashed; }
.test.auto.on .tn { border-style:solid; }
.test em.ok { font-style:normal; font-weight:600; color:var(--test); }
.nextlink { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0 14px; border-top:1px solid var(--line); font-size:13.5px; color:var(--ink2); }
.nextlink button { font-size:14px; font-weight:600; color:var(--ink); padding:4px 0; }
.nextlink.ready span { color:var(--test); font-weight:600; }
.nextlink.ready button { color:var(--test); }
.winline { display:flex; align-items:center; gap:6px; flex:none; }
.winline input { width:78px; font-size:16px; font-weight:600; text-align:right; border:1px solid var(--line); border-radius:8px; background:var(--field); padding:6px 8px; outline:0; -webkit-appearance:none; appearance:none; }
.stagenav { display:flex; justify-content:space-between; gap:10px; margin-top:14px; }
.stagenav button { flex:1; font-size:14.5px; font-weight:600; color:var(--ink); padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.stagenav button small { display:block; font-size:11.5px; font-weight:500; color:var(--ink3); margin-bottom:1px; }
.stagenav span { flex:1; }
.stagenav button:last-child { color:var(--ink); text-align:right; }

/* ---------- calendário: passado, hoje, futuro ---------- */
.day.past { opacity:.5; }
.day.past .n { font-weight:500; }
.day.today { box-shadow:inset 0 0 0 2px var(--ink); border-radius:10px; margin:0 2.5px; border-color:transparent; z-index:1; }
.day.estd { border-style:dashed; }
.day.estd.jl { border-left-color:transparent; } .day.estd.jr { border-right-color:transparent; }
.calhead { display:flex; align-items:baseline; justify-content:space-between; margin:4px 4px 0; font-size:13px; color:var(--ink2); }
.calhead b { color:var(--ink); font-weight:600; }
.legcard { margin-top:26px; }
.legcard h4 { font-family:Lora, serif; font-size:17px; font-weight:600; margin-bottom:10px; }
.leggrid { display:grid; grid-template-columns:1fr 1fr; gap:9px 12px; font-size:13px; color:var(--ink2); }
.leggrid .lg { gap:8px; }
.legsep { height:1px; background:var(--line); margin:14px 0; }
.mini { width:26px; height:20px; border-radius:6px; border:1px solid var(--line); background:color-mix(in srgb, var(--dry) 16%, var(--card)); flex:none; position:relative; }
.mini.past { opacity:.5; }
.mini.today { box-shadow:inset 0 0 0 2px var(--ink); border-color:transparent; }
.mini.estd { border-style:dashed; background-image:repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--card) 55%, transparent) 4px 6px); }
.mini.ms::after { content:"◆"; position:absolute; right:3px; top:1px; font-size:7px; color:var(--dry); }

/* ---------- tab bar ---------- */
.tabs {
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:space-around;
  padding:6px 8px calc(var(--safe-b) + 4px); height:calc(var(--tab-h) + var(--safe-b));
  background:color-mix(in srgb, var(--paper) 90%, transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--ink3); padding-top:4px; text-align:center; }
.tab svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tab.on { color:var(--ink); }

/* ---------- sheet ---------- */
.scrim { position:fixed; inset:0; z-index:40; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s; }
.scrim.on { opacity:1; pointer-events:auto; }
.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:88dvh; overflow:auto; -webkit-overflow-scrolling:touch;
  background:var(--paper); border-radius:20px 20px 0 0; padding:8px 20px calc(var(--safe-b) + 24px);
  transform:translateY(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); max-width:560px; margin:0 auto; visibility:hidden;
}
.sheet.on { transform:none; visibility:visible; }
.grab { width:38px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px; }

.close svg { width:14px; height:14px; stroke:var(--ink2); stroke-width:2.4; }

.set { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:15px; width:100%; }
.set:last-child { border-bottom:0; }
.set small { display:block; color:var(--ink3); font-size:12.5px; }
.set input[type=date], .set input[type=number], .set input[type=text] { font-size:16px; border:1px solid var(--line); background:var(--field); border-radius:9px; padding:7px 9px; min-width:0; max-width:170px; text-align:right; -webkit-appearance:none; appearance:none; }

.lotrow:last-child { border-bottom:0; }
.lotrow .nm { flex:1; font-size:15px; font-weight:600; }
.lotrow .nm small { display:block; font-weight:400; font-size:12.5px; color:var(--ink3); margin-top:1px; }

.toast { position:fixed; left:50%; bottom:calc(var(--tab-h) + var(--safe-b) + 16px); transform:translate(-50%, 20px); z-index:80; background:var(--ink); color:var(--paper); font-size:14px; font-weight:500; padding:10px 16px; border-radius:22px; opacity:0; transition:all .25s; pointer-events:none; white-space:nowrap; }
.toast.on { opacity:1; transform:translate(-50%, 0); }

/* ---------- onboarding ---------- */
.ob { position:fixed; inset:0; z-index:60; background:var(--paper); display:none; flex-direction:column; padding:calc(var(--safe-t) + 14px) 20px calc(var(--safe-b) + 20px); overflow:auto; }
.ob.on { display:flex; }

.opt { display:flex; gap:14px; align-items:flex-start; width:100%; padding:14px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); margin-top:10px; transition:border-color .15s, background .15s; }
.opt.on { border-color:var(--c, var(--ink)); background:color-mix(in srgb, var(--c, var(--ink)) 8%, var(--card)); }
.opt .ra { width:20px; height:20px; border-radius:10px; border:1.5px solid var(--ink3); flex:none; margin-top:1px; display:grid; place-items:center; }

</style>

<script>
/* =========================================================
   Datas
   ========================================================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => iso(new Date());
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEMANA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmt = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MES[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const range = (a, b) => a === b ? fmtShort(a) : `${fmtShort(a)} – ${fmtShort(b)}`;
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(Math.round(n * 10) / 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days = n => n === 1 ? '1 dia' : `${n} dias`;

/* =========================================================
   Métodos e etapas
   ========================================================= */
const METHODS = {
  washed:  { l:'Lavado',  d:'Despolpa, fermenta em água para soltar a mucilagem, lava e seca. Café mais limpo e ácido.',
             stages:['harvest','pulp','ferment','dry','rest','peel','roast','degas','done'], target:50, dryEst:21, dryMin:10 },
  natural: { l:'Natural', d:'Seca a cereja inteira, com casca. Mais fácil e encorpado, mas a secagem é mais longa.',
             stages:['harvest','dry','rest','peel','roast','degas','done'], target:45, dryEst:28, dryMin:14 },
  honey:   { l:'Honey',   d:'Despolpa e seca sem lavar, com a mucilagem grudada. Mais doce; exige ar seco e muito cuidado com mofo.',
             stages:['harvest','pulp','dry','rest','peel','roast','degas','done'], target:50, dryEst:21, dryMin:12 },
};
// est = duração estimada em dias (0 = acontece no mesmo dia da etapa seguinte)
const STAGES = {
  harvest: { a:'a', l:'Colheita e triagem', s:'Colheita', est:0, min:0, ob:'Colhi as cerejas', obd:'Ainda não despolpei nem pus para secar' },
  pulp:    { a:'a', l:'Despolpa', s:'Despolpa', est:0, min:0, ob:'Estou despolpando', obd:'Tirando a casca e a polpa das cerejas' },
  ferment: { a:'a', l:'Fermentação', s:'Fermentação', est:2, min:1, ob:'Fermentando', obd:'Grãos de molho para soltar a mucilagem' },
  dry:     { a:'a', l:'Secagem', s:'Secagem', est:21, min:10, ob:'Secando', obd:'Na tela, peneira ou desidratador' },
  rest:    { a:'o', l:'Descanso', s:'Descanso', est:21, min:14, ob:'Descansando', obd:'Já seco, guardado antes de descascar' },
  peel:    { a:'o', l:'Descasque', s:'Tirar casca', est:1, min:0, ob:'Pronto para descascar', obd:'Descanso concluído' },
  roast:   { a:'a', l:'Torra', s:'Torrar', est:1, min:0, ob:'Torrando', obd:'Café verde pronto para ir ao fogo' },
  degas:   { a:'a', l:'Desgaseificação', s:'Esperar', est:4, min:2, ob:'Torrado, esperando o gás sair', obd:'2 a 5 dias antes de moer' },
  done:    { a:'', l:'Pronto para beber', s:'1º café', est:1, min:0, ob:'', obd:'' },
};
const stagesOf = lot => METHODS[lot.method].stages;
const estOf = (lot, k) => (lot.est && lot.est[k] != null) ? lot.est[k] : (k === 'dry' ? METHODS[lot.method].dryEst : STAGES[k].est);
const minOf = (lot, k) => k === 'dry' ? METHODS[lot.method].dryMin : STAGES[k].min;

/* =========================================================
   Estado
   ========================================================= */
const KEY = 'torra-certa.v2';
let DB;
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.lots) return d; } catch (e) {}
  const db = { v:2, lots:[], active:null };
  try { const old = JSON.parse(localStorage.getItem('torra-certa.v1')); if (old) migrateV1(db, old); } catch (e) {}
  return db;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
const uid = () => Math.random().toString(36).slice(2, 9);
const lot = () => DB.lots.find(l => l.id === DB.active) || null;

function newLot({ name, method, cherryKg }) {
  return { id:uid(), name, method, cherryKg:cherryKg || null, created:today(), archived:false,
           log:[], est:{}, refWeight:null, weights:{}, checks:{}, tests:[false,false,false,false,false], testsDate:null, notes:{} };
}
function migrateV1(db, o) {
  const l = newLot({ name:'Café de outubro', method:'washed', cherryKg:1 });
  const h = o.harvest || '2026-10-25', ds = o.dryStart || '2026-10-26';
  l.log = [{ k:'harvest', d:h }, { k:'pulp', d:h }, { k:'ferment', d:h }, { k:'dry', d:ds }];
  if (o.dryEnd) l.log.push({ k:'rest', d:add(o.dryEnd, 1) });
  l.est = { dry:o.estDryDays || 28, rest:(o.restDays || 20) - 1 };
  Object.assign(l, { refWeight:o.washWeight || null, weights:o.weights || {}, checks:o.checks || {}, notes:o.notes || {},
                     tests:o.tests || l.tests, testsDate:o.testsDate || null });
  db.lots.push(l); db.active = l.id;
}

DB = load();

/* ---------- linha do tempo ---------- */
function timeline(L) {
  const ks = stagesOf(L), t = today(), log = L.log;
  const ci = ks.indexOf(log[log.length - 1].k);
  const out = []; let cursor = null;
  ks.forEach((k, i) => {
    const e = estOf(L, k);
    if (i <= ci) {
      const a = log.find(x => x.k === k)?.d ?? cursor ?? log[0].d;
      let b;
      if (i < ci) { const nxt = log.find(x => x.k === ks[i + 1]); b = add(nxt.d, -1); cursor = nxt.d; }
      else { const plannedEnd = add(a, Math.max(e, 1) - 1); b = plannedEnd < t ? t : plannedEnd; cursor = add(b, 1); }
      out.push({ k, a, b, i, state: i < ci ? 'past' : 'cur', est:false });
    } else {
      const a = cursor, b = add(a, e - 1);
      cursor = e > 0 ? add(b, 1) : a;
      out.push({ k, a, b, i, state:'fut', est:true });
    }
  });
  return out;
}
const curStage = L => L.log[L.log.length - 1].k;
const curStart = L => L.log[L.log.length - 1].d;
function stageAt(TL, d) { let hit = null; for (const s of TL) if (s.a <= s.b && d >= s.a && d <= s.b) hit = s; return hit; }
function sub(L, s, d) {
  if (!s) return null;
  if (s.k !== 'dry') return s.k;
  const n = diff(s.a, d) + 1;
  return n <= 3 ? 'crit' : n >= 15 ? 'test' : 'dry';
}
const SUBL = { crit:'Secagem: fase crítica', test:'Secagem: testes de ponto' };

/* ---------- tarefas ---------- */
function testsFor(L) {
  return [
    ['Peso estável', 'Parou de perder peso por 2 dias seguidos'],
    L.method === 'natural' ? ['Casca do fruto', 'Escura, dura e quebradiça; o grão chacoalha dentro'] : ['Pergaminho', 'Quebradiço, estala e solta fácil entre os dedos'],
    ['Som', 'Sacudido num pote, barulho de pedrinha, não abafado'],
    ['Mordida', 'Grão descascado duro, quebra seco, o dente não marca'],
    ['Pote fechado', '24 h num pote de vidro sem vapor ou gotinhas na parede'],
  ];
}
function tasksFor(L, d) {
  const TL = timeline(L), s = stageAt(TL, d);
  if (!s) return { s:null, list:[], msg: d < L.log[0].d ? 'Antes do início deste lote.' : 'Lote concluído.' };
  const n = diff(s.a, d) + 1, list = [];
  const turn = c => ({ id:'turn', l:'Revirar', sub:`${c} vezes ao dia`, count:c });
  const look = { id:'look', l:'Olhar e cheirar', sub:'Pontos brancos ou verdes, cheiro de mofo' };
  const weigh = { id:'weigh', l:'Pesar', sub:'Sempre no mesmo horário', weigh:true };
  let msg = '';
  switch (s.k) {
    case 'harvest':
      list.push({ id:'sort', l:'Separar cerejas', sub:'Tirar verdes, secas, furadas ou bichadas' },
                { id:'float', l:'Teste da boia', sub:'Na água, descartar as que boiarem' });
      if (L.method === 'natural') list.push({ id:'spread', l:'Espalhar para secar', sub:'Camada única, com ar por baixo' });
      break;
    case 'pulp':
      list.push({ id:'squeeze', l:'Despolpar', sub:'Apertar as cerejas para soltar os grãos' },
                { id:'pick', l:'Catar as cascas', sub:'Casca no meio causa mofo e sabor estranho' });
      list.push(L.method === 'washed' ? { id:'soak', l:'Cobrir com água limpa', sub:'Pote de vidro ou plástico, tampado com pano' }
                                      : { id:'spread', l:'Espalhar para secar sem lavar', sub:'Camada fina: a mucilagem gruda' });
      break;
    case 'ferment':
      list.push({ id:'water', l:'Trocar a água', sub:'1 a 2 vezes ao dia' },
                { id:'rub', l:'Teste do atrito', sub:'Áspero e rangendo como cascalho = pronto' },
                { id:'smell', l:'Cheirar', sub:'Frutado é normal; vinagre forte, passou' });
      break;
    case 'dry':
      if (n <= 3) list.push(turn(L.method === 'honey' ? 5 : 4), look, { id:'fan', l:'Ventilação direta', sub:'Ventilador 24 h nesta fase' });
      else if (n <= 7) list.push(turn(3), look);
      else list.push(turn(2), weigh, look);
      if (n >= 15 && ((n - 15) % 2 === 0)) list.push({ id:'tests', l:'Testes de ponto', sub:'A cada 2 dias', tests:true });
      break;
    case 'rest':
      if (n % 7 === 0) list.push({ id:'week', l:'Checagem semanal', sub:'Cheiro e sinais de mofo no saco' });
      else msg = 'Nada a fazer hoje. Deixe descansar em lugar seco e arejado.';
      break;
    case 'peel':
      list.push(L.method === 'natural'
        ? { id:'peel', l:'Quebrar a casca seca', sub:'Pilão leve ou liquidificador em pulsos curtos' }
        : { id:'peel', l:'Tirar o pergaminho', sub:'Esfregar entre as mãos ou num pano' },
        { id:'blow', l:'Soprar as cascas', sub:'Ventilador ou vento leve' },
        { id:'sort', l:'Separar defeitos', sub:'Grãos pretos, furados ou quebrados' });
      break;
    case 'roast': {
      const done = (DB.sessions || []).some(x => x.lotId === L.id && x.batches.length);
      list.push({ id:'roast', l:'Torrar', sub: done ? 'Torra registrada' : 'A torra guiada cuida do tempo, do resfriamento e do registro', roastGo:true, done },
                { id:'jar', l:'Guardar em pote com tampa', sub:'Depois de esfriar' });
      break; }
    case 'degas': msg = 'Deixe o gás sair. Ainda não moa o café.'; break;
    case 'done': {
      const S = (DB.sessions || []).filter(x => x.lotId === L.id && x.batches.length).pop();
      list.push({ id:'cup', l:'Passar o primeiro café', sub:'Moa na hora de passar' });
      if (S) list.push({ id:'taste', l:'Avaliar a torra', sub: S.tasting ? `Nota ${S.tasting.geral}/5` : 'Aroma, doçura, acidez, corpo…', tasteId:S.id, done:!!S.tasting });
      break; }
  }
  return { s, n, list, msg };
}
function taskVal(L, d, t) {
  if (t.roastGo || t.tasteId) return t.done ? 1 : 0;
  if (t.weigh) return L.weights[d] != null ? 1 : 0;
  if (t.tests) return L.testsDate === d ? 1 : 0;
  return (L.checks[d] && L.checks[d][t.id]) || 0;
}
const isDone = (L, d, t) => { const v = taskVal(L, d, t); return t.count ? v >= t.count : !!v; };
function setTask(L, d, id, v) {
  L.checks[d] = L.checks[d] || {};
  if (v) L.checks[d][id] = v; else delete L.checks[d][id];
  if (!Object.keys(L.checks[d]).length) delete L.checks[d];
  save();
}

/* ---------- peso ---------- */
const series = L => Object.keys(L.weights).sort().map(d => ({ d, g:L.weights[d] }));
const ref = L => L.refWeight || (series(L)[0] || {}).g || null;
function stable(L) {
  const w = series(L); if (w.length < 3) return false;
  const [a, b, c] = w.slice(-3);
  if (diff(a.d, b.d) !== 1 || diff(b.d, c.d) !== 1) return false;
  const ok = (x, y) => Math.abs(y.g - x.g) / x.g <= 0.01;
  return ok(a, b) && ok(b, c);
}

/* ---------- sinais de que a etapa terminou ---------- */
function signsFor(L, k, d) {
  const n = diff(curStart(L), d || today()) + 1, e = estOf(L, k);
  const S = (l, sub) => ({ l, sub });
  const A = (l, sub, ok) => ({ l, sub, auto:true, ok });
  switch (k) {
    case 'harvest': return [S('Cerejas separadas', 'Verdes, secas, furadas e bichadas fora'), S('Teste da boia feito', 'As que boiaram foram descartadas'),
      ...(L.method === 'natural' ? [S('Espalhadas para secar', 'Camada única, com ar por baixo')] : [])];
    case 'pulp': return [S('Grãos soltos da polpa', 'Nenhuma cereja inteira sobrando'), S('Sem cascas no meio', 'Pedaços vermelhos catados'),
      L.method === 'washed' ? S('Grãos cobertos com água', 'Prontos para fermentar') : S('Espalhados em camada fina', 'Sem lavar, prontos para secar')];
    case 'ferment': return [S('Áspero ao esfregar', 'Nenhum ponto escorregadio, em grãos de cima, meio e fundo'),
      S('Range como cascalho', 'Ao apertar um punhado na mão'), S('Teste do buraco', 'Escorrido, o buraco feito com o dedo na massa não desmorona')];
    case 'dry': return testsFor(L).map(([a, b]) => S(a, b));
    case 'rest': return [A(`${Math.min(n, e)} de ${e} dias de descanso`, 'O ideal é de 3 a 4 semanas', n >= e), S('Cheiro limpo', 'Sem mofo nem cheiro de umidade no saco')];
    case 'peel': return [S('Sem casca', L.method === 'natural' ? 'Casca seca e pergaminho removidos' : 'Pergaminho removido'), S('Cascas sopradas', 'Só o café verde na peneira'), S('Defeitos separados', 'Grãos pretos, furados ou quebrados fora')];
    case 'roast': { const done = (DB.sessions || []).some(x => x.lotId === L.id && x.batches.length);
      return [A('Torra registrada', 'Pela torra guiada, com tempos e perda', done), S('Cor uniforme', 'No ponto escolhido, sem grãos crus'), S('Guardados com tampa', 'Depois de frios, em pote fechado')]; }
    case 'degas': return [A(`${Math.min(n, 5)} de 2 a 5 dias desde a torra`, 'O gás precisa sair antes de moer', n >= 2)];
    default: return [];
  }
}
function signVal(L, k, i) { if (k === 'dry') return !!L.tests[i]; return !!((L.signs || {})[k] || [])[i]; }
function setSign(L, k, i) {
  if (k === 'dry') { L.tests[i] = !L.tests[i]; L.testsDate = today(); }
  else { L.signs = L.signs || {}; L.signs[k] = L.signs[k] || []; L.signs[k][i] = !L.signs[k][i]; }
  save();
}
function signsState(L, k) {
  const SG = signsFor(L, k), ok = SG.filter((x, i) => x.auto ? x.ok : signVal(L, k, i)).length;
  return { SG, ok, all: SG.length > 0 && ok === SG.length };
}
// compatível com chamadas antigas
function readiness(L) { const k = curStage(L); return k !== 'done' && signsState(L, k).all ? 'ok' : null; }

   Render

const $ = s => document.querySelector(s);
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

};

function renderTrack(L, TL, t) {
  const vis = TL.filter(s => s.a <= s.b), start = vis[0].a, end = vis[vis.length - 1].b;
  const total = diff(start, end) + 1, pct = d => diff(start, d) / total * 100;
  const segs = vis.map(s => `<div class="seg p-${s.k}" style="left:${pct(s.a)}%;width:${(diff(s.a, s.b) + 1) / total * 100}%"></div>`).join('');
  const mark = t >= start && t <= end ? `<div class="todaybar" style="left:${pct(t) + 50 / total}%"></div>` : '';
  return `<div class="track"><div class="bar-wrap"><div class="bar">${segs}</div>${mark}</div>
    <div class="ticks"><span>${fmt(start)}</span><span>${fmt(end)}${TL[TL.length - 1].est ? ' (est.)' : ''}</span></div></div>`;
}

function taskRow(L, d, t, k) {
  const v = taskVal(L, d, t), done = isDone(L, d, t), r = ref(L);
  let ctl, subl = t.sub || '';
  if (t.count) ctl = `<div class="pips">${Array.from({ length:t.count }, (_, i) => `<button class="pip ${i < v ? 'on' : ''}" data-act="pip" data-d="${d}" data-id="${t.id}" data-i="${i}" aria-label="Vez ${i + 1}"></button>`).join('')}</div>`;
  else if (t.weigh) {
    const g = L.weights[d];
    if (g != null && r) subl = `${Math.round(g / r * 100)}% da referência · meta ≈ ${METHODS[L.method].target}%`;
    ctl = `<span class="winline"><input class="wIn" type="number" inputmode="decimal" placeholder="g" value="${g ?? ''}" aria-label="Peso em gramas"><button class="go" data-act="saveweigh" data-d="${d}">${g != null ? 'ok' : 'Salvar'}</button></span>`;
  }
  else if (t.tests) ctl = `<button class="go" data-act="gotests">${v ? 'Feito' : 'Ver'}</button>`;
  else if (t.roastGo) ctl = `<button class="go" data-r="newlot" data-lot="${L.id}">${t.done ? 'Nova' : 'Iniciar'}</button>`;
  else if (t.tasteId) ctl = `<button class="go" data-r="taste" data-id="${t.tasteId}">${t.done ? 'Ver' : 'Avaliar'}</button>`;

  return `<div class="task ${done ? 'done' : ''} p-${k}"><div class="tl">${t.l}<small>${subl}</small></div>${ctl}</div>`;
}

function renderHoje() {
  const L = lot(); if (!L) { $('#v-hoje').innerHTML = ''; return; }
  const t = today(), TL = timeline(L), T = tasksFor(L, t);
  const k = curStage(L), ks = stagesOf(L), ci = ks.indexOf(k), next = ks[ci + 1];
  const cs = TL[ci], n = diff(cs.a, t) + 1, sk = sub(L, cs, t) || k;
  const title = k === 'dry' && SUBL[sk] ? SUBL[sk] : STAGES[k].l;
  const plannedEnd = add(cs.a, Math.max(estOf(L, k), 1) - 1), left = diff(t, plannedEnd);

  // 1. onde estou
  let h = `<div class="card hero p-${sk}">
    <div class="herotop"><div class="when">${k === 'done' ? cap(fmtLong(t)) : `Dia ${n} · ${METHODS[L.method].l}`}</div>
      <button class="stagebtn" data-act="stages" aria-label="Etapas">Etapa ${ci + 1} de ${ks.length}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <h2>${title}</h2>
    <div class="sub">${k === 'done' ? 'Bom café!' : `Desde ${fmtShort(cs.a)} · ${left > 0 ? `prazo típico até ${fmtShort(plannedEnd)}` : left === 0 ? 'prazo típico termina hoje' : `${days(-left)} além do prazo típico`}`}</div>
    ${renderTrack(L, TL, t)}
  </div>`;

  // 2. o que fazer hoje
  h += `<div class="sec-title">O que fazer hoje<small>${T.list.length ? `${T.list.filter(x => isDone(L, t, x)).length} de ${T.list.length}` : fmtShort(t)}</small></div>`;
  h += `<div class="card tasks">${T.list.length ? T.list.map(x => taskRow(L, t, x, sk)).join('') : `<div class="empty">${T.msg}</div>`}</div>`;

  // 3. como saber que terminou
  if (k === 'done') {
    h += `<div class="sec-title">Lote concluído</div><div class="card"><p style="font-size:14.5px;color:var(--ink2)">Anote como ficou o café no calendário. Quando quiser, arquive o lote.</p>
      <div class="nextlink"><button data-act="archive">${L.archived ? 'Desarquivar lote' : 'Arquivar lote'}</button></div></div>`;
  } else {
    const st = signsState(L, k), stab = k === 'dry' && stable(L);
    h += `<div class="sec-title" id="signsAnchor">Como saber que terminou<small>${st.ok} de ${st.SG.length}</small></div>
    <div class="card p-test signs">
      ${st.SG.map((x, i) => {
        const on = x.auto ? x.ok : signVal(L, k, i);
        return `<button class="test ${on ? 'on' : ''} ${x.auto ? 'auto' : ''}" ${x.auto ? 'disabled' : `data-act="sign" data-k="${k}" data-i="${i}"`}><span class="tn">${on ? ICON.check : i + 1}</span><span><b>${x.l}</b><p>${x.sub}${k === 'dry' && i === 0 && stab ? ' · <em class="ok">o peso estabilizou</em>' : ''}</p></span></button>`;
      }).join('')}
      ${k === 'dry' && n < 15 ? `<p class="hint" style="text-align:left;margin:4px 0 12px">Os testes começam a fazer sentido a partir do dia 15.</p>` : ''}
      ${st.all && next ? `<div class="nextlink ready"><span>Etapa concluída</span><button data-act="advance">Avançar para ${STAGES[next].l.toLowerCase()} ›</button></div>` : ''}
    </div>`;
  }

  // 4. pontos de atenção
  h += alertCard(L, k);
  $('#v-hoje').innerHTML = h;
}

function alertCard(L, k) {

    pulp:[['Demora', 'despolpe e comece a fermentar ou secar no mesmo dia da colheita.'], ['Cascas no meio', 'causam mofo e sabor estranho.']],

function stagesSheet() {

/* ---------- calendário ---------- */
function renderCal() {
  const L = lot(); if (!L) return;
  const TL = timeline(L), t = today(), vis = TL.filter(s => s.a <= s.b);
  const keys = [];
  vis.forEach(s => { if (s.k === 'dry') keys.push('crit', 'dry', 'test'); else keys.push(s.k); });
  const LBL = { crit:'Fase crítica', dry:'Secagem', test:'Testes de ponto' };
  const cur = TL.find(x => x.state === 'cur'), ck = sub(L, cur, t);
  let h = `<div class="calhead"><span>Hoje: <b>${SUBL[ck] || STAGES[cur.k].l}</b></span><span>${fmtShort(t)}</span></div>`;
  const legend = `<div class="card legcard"><h4>Legenda</h4>
    <div class="leggrid">${[...new Set(keys)].map(k => `<span class="lg p-${k}"><i class="sw"></i>${LBL[k] || STAGES[k].l}</span>`).join('')}</div>

  const s0 = parse(vis[0].a), e0 = parse(vis[vis.length - 1].b);
  const startOf = d => TL.filter(s => s.a === d);
  for (let y = s0.getFullYear(), m = s0.getMonth(); y < e0.getFullYear() || (y === e0.getFullYear() && m <= e0.getMonth()); m === 11 ? (y++, m = 0) : m++) {
    const first = new Date(y, m, 1), nd = new Date(y, m + 1, 0).getDate();
    let cells = ['D','S','T','Q','Q','S','S'].map(x => `<div class="wd">${x}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) cells += '<div class="day blank"></div>';
    for (let dd = 1; dd <= nd; dd++) {
      const d = iso(new Date(y, m, dd)), wd = new Date(y, m, dd).getDay();
      const s = stageAt(TL, d), k = sub(L, s, d);
      const kp = dd > 1 && wd !== 0 ? sub(L, stageAt(TL, add(d, -1)), add(d, -1)) : null;

      const ms = startOf(d)[0];

      if (k && kp === k) cls.push('jl');
      if (k && kn === k) cls.push('jr');
      if (d === t) cls.push('today'); else if (d < t) cls.push('past');

        <span class="n">${dd}</span>${ms ? `<span class="mk p-${ms.k}">${sym}</span><span class="ms">${STAGES[ms.k].s}</span>` : (logged ? `<span class="dots">${L.weights[d] != null ? '<i></i>' : ''}${L.notes[d] ? '<i></i>' : ''}${L.checks[d] && L.weights[d] == null && !L.notes[d] ? '<i></i>' : ''}</span>` : '')}</div>`;

/* ---------- peso ---------- */
function renderPeso() {
  const L = lot(); if (!L) return;
  const t = today(), w = series(L), r = ref(L), tg = METHODS[L.method].target;
  let h = `<div class="sec-title">Pesar hoje<small>${fmtShort(t)}</small></div>
  <div class="card"><div class="wrow"><label class="field"><input class="wIn" type="number" inputmode="decimal" placeholder="0" value="${L.weights[t] ?? ''}"><span>g</span></label>

    h += `<div class="stats">
      <div class="stat"><div class="k">Atual</div><div class="v">${last.g} g</div></div>

  }
  h += `</div>`;
  const refLbl = L.method === 'natural' ? 'Peso das cerejas ao pôr para secar' : L.method === 'honey' ? 'Peso logo após despolpar' : 'Peso logo após lavar';
  h += `<div class="sec-title">Referência</div><div class="card" style="padding:2px 16px">
    <div class="set"><span>${refLbl}<small>${L.refWeight ? `Meta ≈ ${Math.round(L.refWeight * tg / 100)} g (${tg}%, aproximado)` : (w.length ? `Sem valor: usando o 1º registro (${w[0].g} g)` : 'Se não pesou, o 1º registro vira referência')}</small></span>
    <input type="number" inputmode="decimal" id="refIn" value="${L.refWeight ?? ''}" placeholder="g"></div></div>`;
  if (w.length >= 2) h += `<div class="sec-title">Curva</div><div class="card">${chart(w, r, tg)}</div>`;
  if (w.length) {
    h += `<div class="sec-title">Registros<small>${w.length}</small></div><div class="card wlist" style="padding:4px 16px">`;
    [...w].reverse().forEach((x, i, arr) => {
      const p = arr[i + 1];
      h += `<div class="wi"><span class="d">${fmt(x.d)}</span><span class="g">${x.g} g</span><span class="pc">${r ? Math.round(x.g / r * 100) + '%' : ''}</span><span class="dl">${p ? sgn(x.g - p.g) : ''}</span><button class="x" data-act="delweigh" data-d="${x.d}" aria-label="Apagar">×</button></div>`;
    });
    h += `</div>`;
  } else {
    h += `<div class="hint" style="margin-top:20px">Nenhum registro ainda. A pesagem diária começa no 8º dia de secagem.</div>`;
  }
  $('#v-peso').innerHTML = h;
}
function chart(w, r, tg) {
  const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22;
  const d0 = w[0].d, dN = w[w.length - 1].d, span = Math.max(diff(d0, dN), 1);
  const gs = w.map(x => x.g), target = r ? r * tg / 100 : null;
  let lo = Math.min(...gs, target ?? Infinity), hi = Math.max(...gs, r ?? 0);
  const pv = (hi - lo) * .08 || 10; lo -= pv; hi += pv;
  const X = d => L + diff(d0, d) / span * (W - L - R), Y = g => T + (hi - g) / (hi - lo) * (H - T - B);
  const pts = w.map(x => `${X(x.d).toFixed(1)},${Y(x.g).toFixed(1)}`).join(' ');
  const ticks = [hi - pv, (hi + lo) / 2, lo + pv].map(v => Math.round(v));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" font-family="Inter" font-size="10">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end" style="fill:var(--ink3)">${v}</text>`).join('')}
    ${target ? `<line x1="${L}" x2="${W - R}" y1="${Y(target)}" y2="${Y(target)}" style="stroke:var(--test)" stroke-dasharray="4 4"/><text x="${L + 4}" y="${Y(target) + 13}" style="fill:var(--test)" font-weight="600">meta ${tg}%</text>` : ''}
    <polyline points="${pts}" fill="none" style="stroke:var(--dry)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${w.map(x => `<circle cx="${X(x.d)}" cy="${Y(x.g)}" r="3.2" style="fill:var(--card);stroke:var(--dry)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H - 5}" style="fill:var(--ink3)">${fmt(d0)}</text><text x="${W - R}" y="${H - 5}" text-anchor="end" style="fill:var(--ink3)">${fmt(dN)}</text>
  </svg>`;
}

/* =========================================================
   Sheets

function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').scrollTop = 0; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); sheetCtx = null; renderAll(); }
const closeBtn = `<button class="close" data-act="close" aria-label="Fechar">${ICON.x}</button>`;
let sheetCtx = null;
function refreshSheet() { if (!sheetCtx) return; const [fn, ...args] = sheetCtx; fn(...args); }

function daySheet(d) {
  sheetCtx = [daySheet, d];
  const L = lot(), T = tasksFor(L, d), s = T.s, k = sub(L, s, d);
  const ms = timeline(L).filter(x => x.a === d);
  let h = `<div class="shead"><div><h3>${cap(fmtLong(d))}</h3>
    ${s ? `<span class="chip p-${k}"><i class="sw"></i>${SUBL[k] || STAGES[s.k].l}${s.est ? ' · est.' : ''}</span>` : ''}
    ${ms.map(x => `<span class="chip p-${x.k}">${x.state === 'fut' ? '◇' : '◆'} Início: ${STAGES[x.k].l.toLowerCase()}</span>`).join('')}</div>${closeBtn}</div>`;
  if (s && T.list.length) h += `<div class="lbl">Tarefas</div><div class="card tasks">${T.list.map(x => taskRow(L, d, x, k)).join('')}</div>`;
  else if (T.msg) h += `<div class="card" style="color:var(--ink2);font-size:14.5px">${T.msg}</div>`;
  if (s && s.k === 'dry') h += `<div class="lbl">Peso</div><div class="wrow"><label class="field"><input class="wIn" type="number" inputmode="decimal" placeholder="0" value="${L.weights[d] ?? ''}"><span>g</span></label><button class="btn" data-act="saveweigh" data-d="${d}">Salvar</button></div>`;
  h += `<div class="lbl">Anotações</div><textarea id="noteIn" data-d="${d}" placeholder="Cheiro, aparência, umidade do dia…">${esc(L.notes[d])}</textarea>`;

}

function advanceSheet() {
  sheetCtx = [advanceSheet];
  const L = lot(), ks = stagesOf(L), k = curStage(L), nx = ks[ks.indexOf(k) + 1];
  openSheet(`<div class="shead"><div><h3>Avançar para ${STAGES[nx].l.toLowerCase()}</h3><p class="lead">Encerra ${STAGES[k].a} ${STAGES[k].l.toLowerCase()}, ${STAGES[k].a === 'o' ? 'iniciado' : 'iniciada'} em ${fmtShort(curStart(L))}.</p></div>${closeBtn}</div>
    <div class="lbl">Quando começou ${STAGES[nx].a} ${STAGES[nx].l.toLowerCase()}?</div>

function stageSheet(k) {
  sheetCtx = [stageSheet, k];
  const L = lot(), TL = timeline(L), s = TL.find(x => x.k === k), ks = stagesOf(L), i = ks.indexOf(k);
  const entry = L.log.find(x => x.k === k);
  const prevD = i > 0 ? (L.log.find(x => x.k === ks[i - 1]) || {}).d : null, nextD = (L.log.find(x => x.k === ks[i + 1]) || {}).d;
  let h = `<div class="shead"><div><h3>${STAGES[k].l}</h3><span class="chip p-${k}"><i class="sw"></i>${s.state === 'past' ? 'Concluída' : s.state === 'cur' ? 'Etapa atual' : 'Próxima · estimada'}</span></div>${closeBtn}</div>`;
  if (entry) {
    h += `<div class="lbl">Início</div><div class="card" style="padding:2px 16px"><div class="set"><span>Data de início</span>
      <input type="date" data-stage-date="${k}" value="${entry.d}" ${prevD ? `min="${prevD}"` : ''} max="${nextD || today()}"></div></div>`;
    if (s.state === 'past') h += `<button class="btn ghost" data-act="rewindto" data-k="${k}">Voltar para esta etapa</button><p class="hint">As etapas seguintes voltam a ser estimadas. Registros de peso e anotações são mantidos.</p>`;
  } else {
    h += `<p class="lead" style="font-size:14.5px;color:var(--ink2)">${s.a <= s.b ? `Previsão: ${range(s.a, s.b)}.` : `Previsão: ${fmtShort(s.a)}.`} Ajuste a duração estimada das etapas nos ajustes do lote.</p>`;
    if (i === ks.indexOf(curStage(L)) + 1) h += `<button class="btn" data-act="advance">Avançar para esta etapa</button>`;
  }
  h += `<div class="lbl">Como fazer</div><div class="card gcard p-${k}"><ul style="margin-top:0">${(GUIDE[k][L.method] || GUIDE[k].all).map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  openSheet(h);
}

function lotsSheet() {
  sheetCtx = [lotsSheet];
  const act = DB.lots.filter(l => !l.archived), arc = DB.lots.filter(l => l.archived);
  const row = l => { const k = curStage(l); return `<button class="lotrow p-${k}" data-act="pick" data-id="${l.id}"><i class="sw"></i><span class="nm">${esc(l.name)}<small>${METHODS[l.method].l} · ${STAGES[k].l}</small></span>${l.id === DB.active ? '<span class="on">aberto</span>' : ''}</button>`; };
  openSheet(`<div class="shead"><h3>Lotes</h3>${closeBtn}</div>
    <div class="card" style="padding:2px 16px">${act.length ? act.map(row).join('') : '<div class="empty">Nenhum lote ativo.</div>'}</div>

}

function settingsSheet() {
  sheetCtx = [settingsSheet];
  const L = lot(); if (!L) return;
  const ks = stagesOf(L).filter(k => ['ferment','dry','rest','degas'].includes(k));
  openSheet(`<div class="shead"><h3>Ajustes do lote</h3>${closeBtn}</div>
  <div class="card" style="padding:2px 16px">
    <div class="set"><span>Nome</span><input type="text" data-lot="name" value="${esc(L.name)}"></div>
    <div class="set"><span>Cereja colhida<small>Opcional</small></span><input type="number" inputmode="decimal" data-lot="cherryKg" value="${L.cherryKg ?? ''}" placeholder="kg"></div>
    <div class="set"><span>Método</span><b>${METHODS[L.method].l}</b></div>
  </div>
  <div class="lbl">Duração estimada</div><div class="card" style="padding:2px 16px">
    ${ks.map(k => `<div class="set"><span>${STAGES[k].l}<small>${k === curStage(L) ? 'Etapa atual' : ''}</small></span><div class="stepper"><button data-act="step" data-k="${k}" data-v="-1" aria-label="Menos">−</button><span>${estOf(L, k)}</span><button data-act="step" data-k="${k}" data-v="1" aria-label="Mais">+</button></div></div>`).join('')}
  </div>
  <p class="hint">Em dias. Usada só para prever as datas; quem decide é você, avançando a etapa.</p>

    <div class="set"><span>${L.archived ? 'Desarquivar' : 'Arquivar'}<small>Lotes arquivados ficam em Lotes</small></span><button class="go" data-act="archive">${L.archived ? 'Desarquivar' : 'Arquivar'}</button></div>
    <div class="set"><span class="danger">Apagar lote</span><button class="go p-crit" data-act="dellot">Apagar</button></div>
  </div>`);

/* =========================================================

let OB = null;
function startOnboarding(first) {

  if (!first) OB.step = 1;
  renderOB(); $('#ob').classList.add('on');
}
function obSteps() { return ['welcome','lot','method','stage','dates','summary']; }
function renderOB() {
  const st = obSteps(), s = st[OB.step], dots = st.slice(1);
  const canBack = OB.step > (OB.first ? 0 : 1) || !OB.first;
  let body = '', foot = '', valid = true;
  switch (s) {
    case 'welcome':

        <h2>Do pé à <em>xícara</em></h2>

    case 'lot':
      body = `<h2>Seu lote</h2><p class="lead">Dê um nome para reconhecer este café depois.</p>

        <div class="lbl">Quanto de cereja? <span style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></div>
        <label class="field"><input type="number" inputmode="decimal" id="obKg" value="${esc(OB.cherryKg)}" placeholder="0"><span>kg</span></label>`;
      valid = !!OB.name.trim();
      foot = `<button class="btn" data-act="obnext" ${valid ? '' : 'disabled'}>Continuar</button>`;
      break;
    case 'method':
      body = `<h2>Qual o método?</h2><p class="lead">Ele muda as etapas e os cuidados. Na dúvida, a pergunta é: você tirou a casca antes de secar?</p>
        ${Object.entries(METHODS).map(([k, m]) => `<button class="opt ${OB.method === k ? 'on' : ''}" data-act="obmethod" data-m="${k}"><span class="ra"></span><span><b>${m.l}</b><p>${m.d}</p></span></button>`).join('')}`;
      foot = `<button class="btn" data-act="obnext" ${OB.method ? '' : 'disabled'}>Continuar</button>`;
      break;
    case 'stage':
      body = `<h2>Em que pé está?</h2><p class="lead">Escolha a etapa em que o café está agora.</p>
        ${METHODS[OB.method].stages.filter(k => k !== 'done').map(k => `<button class="opt p-${k} ${OB.stage === k ? 'on' : ''}" data-act="obstage" data-k="${k}"><span class="ra"></span><span><b>${STAGES[k].ob}</b><p>${STAGES[k].obd}</p></span></button>`).join('')}`;
      foot = `<button class="btn" data-act="obnext" ${OB.stage ? '' : 'disabled'}>Continuar</button>`;
      break;
    case 'dates': {
      const isH = OB.stage === 'harvest';
      body = `<h2>Desde quando?</h2><p class="lead">As datas servem para calcular o dia de cada etapa e prever as próximas.</p>
        ${isH ? '' : `<div class="lbl">${STAGES[OB.stage].l} começou em</div><label class="field"><input type="date" id="obStageDate" value="${OB.stageDate}" max="${today()}"></label>`}
        <div class="lbl">Colheita</div><label class="field"><input type="date" id="obHarvest" value="${OB.harvestDate}" max="${isH ? today() : OB.stageDate}"></label>
        <p class="hint" style="text-align:left">Não lembra direito? Uma data aproximada já ajuda. Tudo pode ser corrigido depois.</p>`;
      valid = isH || OB.harvestDate <= OB.stageDate;
      foot = `<button class="btn" data-act="obnext" ${valid ? '' : 'disabled'}>Continuar</button>${valid ? '' : '<p class="hint">A colheita precisa ser antes do início da etapa.</p>'}`;
      break; }
    case 'summary': {
      const L = buildLot(); const TL = timeline(L), fin = TL[TL.length - 1];
      body = `<h2>Tudo <em>pronto</em></h2><p class="lead">${esc(L.name)} · ${METHODS[L.method].l}. Primeiro café previsto para <b style="color:var(--ink)">${fmtShort(fin.a)}</b>.</p>
        <div class="card stages summary">${TL.map(s => `<div class="stg ${s.state} p-${s.k}"><span class="rail"><span class="node">${s.state === 'past' ? ICON.check : ''}</span><span class="ln"></span></span>
          <span class="body"><span><span class="nm">${STAGES[s.k].l}</span><span class="dt" style="display:block">${s.state === 'fut' ? 'est. ' : ''}${s.a <= s.b ? range(s.a, s.b) : fmtShort(s.a)}</span></span><span class="rt">${s.state === 'cur' ? 'agora' : ''}</span></span></div>`).join('')}</div>`;
      foot = `<button class="btn" data-act="obfinish">Começar a acompanhar</button>`;
      break; }
  }
  $('#ob').innerHTML = `<div class="ob-top">
      ${canBack ? `<button class="iconbtn" data-act="obback" aria-label="Voltar">${ICON.back}</button>` : '<span></span>'}
      ${s !== 'welcome' ? `<div class="ob-dots">${dots.map((_, i) => `<i class="${i === OB.step - 1 ? 'on' : ''}"></i>`).join('')}</div>` : '<span></span>'}
      <span style="width:36px"></span></div>
    <div class="ob-body">${body}</div><div class="ob-foot">${foot}</div>`;
}
function buildLot() {
  const L = newLot({ name:OB.name.trim(), method:OB.method, cherryKg:parseFloat(OB.cherryKg) || null });
  const ks = METHODS[OB.method].stages, si = ks.indexOf(OB.stage), h = OB.harvestDate;
  const sd = OB.stage === 'harvest' ? h : OB.stageDate;
  let c = h;
  for (let i = 0; i < si; i++) { L.log.push({ k:ks[i], d:c > sd ? sd : c }); c = add(c, estOf(L, ks[i])); }
  L.log.push({ k:OB.stage, d:sd });
  return L;
}

/* =========================================================
   Interações
   ========================================================= */
let toastT;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1900); }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset.d, L = lot();
  const rr = () => { refreshSheet(); renderAll(); };
  switch (a) {
    /* tarefas */
    case 'chk': setTask(L, d, b.dataset.id, taskVal(L, d, { id:b.dataset.id }) ? 0 : 1); rr(); break;
    case 'pip': { const cur = taskVal(L, d, { id:b.dataset.id }), i = +b.dataset.i; setTask(L, d, b.dataset.id, cur === i + 1 ? i : i + 1); rr(); break; }
    case 'goweigh': { const el = (b.closest('#sheetBody') || document).querySelector('.wIn'); el?.scrollIntoView({ behavior:'smooth', block:'center' }); setTimeout(() => el?.focus(), 300); break; }
    case 'gotests': if (sheetCtx) closeSheet(); setTimeout(() => $('#signsAnchor')?.scrollIntoView({ behavior:'smooth', block:'start' }), 50); break;
    case 'saveweigh': {
      const inp = b.parentElement.querySelector('.wIn'), v = parseFloat(inp && inp.value);
      if (!(v > 0)) { toast('Digite o peso em gramas'); break; }
      L.weights[d] = Math.round(v * 10) / 10; save(); toast(`${L.weights[d]} g em ${fmt(d)}`); rr(); break; }
    case 'delweigh': if (confirm(`Apagar o peso de ${fmt(d)}?`)) { delete L.weights[d]; save(); renderAll(); } break;
    case 'test': L.tests[+b.dataset.i] = !L.tests[+b.dataset.i]; L.testsDate = today(); save(); renderAll(); break;
    case 'sign': setSign(L, b.dataset.k, +b.dataset.i); renderAll(); break;
    case 'stages': stagesSheet(); break;

    /* etapas */
    case 'advance': advanceSheet(); break;
    case 'doadvance': {
      const dt = $('#advDate').value || today();
      if (dt < curStart(L)) { toast('Data antes do início da etapa atual'); break; }
      L.log.push({ k:b.dataset.k, d:dt }); save(); closeSheet(); toast(`Agora: ${STAGES[b.dataset.k].l.toLowerCase()}`); window.scrollTo({ top:0, behavior:'smooth' }); break; }
    case 'rewind': {
      const k = curStage(L), ks = stagesOf(L), pk = ks[ks.indexOf(k) - 1];
      if (confirm(`Voltar para ${STAGES[pk].a} ${STAGES[pk].l.toLowerCase()}? O início ${STAGES[k].a === 'o' ? 'do' : 'da'} ${STAGES[k].l.toLowerCase()} (${fmt(curStart(L))}) será desfeito.`)) { L.log.pop(); save(); rr(); toast(`Voltou para ${STAGES[pk].l.toLowerCase()}`); }
      break; }
    case 'rewindto': {
      const k = b.dataset.k, i = L.log.findIndex(x => x.k === k);
      if (confirm(`Voltar para ${STAGES[k].l.toLowerCase()}? As etapas seguintes voltam a ser estimadas.`)) { L.log = L.log.slice(0, i + 1); save(); closeSheet(); toast(`Voltou para ${STAGES[k].l.toLowerCase()}`); }
      break; }
    case 'stage': stageSheet(b.dataset.k); break;
    case 'step': { const k = b.dataset.k; L.est[k] = Math.max(1, Math.min(90, estOf(L, k) + +b.dataset.v)); save(); rr(); break; }

    /* lotes */
    case 'lots': lotsSheet(); break;
    case 'pick': DB.active = b.dataset.id; save(); closeSheet(); window.scrollTo({ top:0 }); break;
    case 'newlot': closeSheet(); startOnboarding(false); break;
    case 'archive': L.archived = !L.archived; save(); toast(L.archived ? 'Lote arquivado' : 'Lote reativado'); rr(); break;
    case 'dellot':
      if (confirm(`Apagar “${L.name}” e todos os registros dele?`)) {
        DB.lots = DB.lots.filter(x => x.id !== L.id); DB.active = (DB.lots.find(x => !x.archived) || DB.lots[0] || {}).id || null; save(); closeSheet();
        if (!DB.lots.length && !DB.roastOnly) startOnboarding(true);
      }
      break;
    case 'settings': settingsSheet(); break;
    case 'day': daySheet(d); break;
    case 'close': closeSheet(); break;
    case 'theme': DB.theme = b.dataset.t; save(); applyTheme(); lotsSheet(); break;
    case 'guidem': guideMethod = b.dataset.m; renderGuia(); break;
    case 'export': try { await navigator.clipboard.writeText(JSON.stringify(DB)); toast('Backup copiado'); } catch (_) { prompt('Copie o backup:', JSON.stringify(DB)); } break;
    case 'import': { const txt = prompt('Cole o backup:'); if (!txt) break; try { const d2 = JSON.parse(txt); if (!d2.lots) throw 0; DB = d2; save(); closeSheet(); toast('Backup restaurado'); } catch (_) { toast('Backup inválido'); } break; }

    /* onboarding */
    case 'obnext': OB.step++; renderOB(); break;
    case 'obback': if (OB.step === 0 || (OB.step === 1 && !OB.first)) { if (DB.lots.length || DB.roastOnly) $('#ob').classList.remove('on'); else { OB.step = 0; renderOB(); } } else { OB.step--; renderOB(); } break;
    case 'obmethod': if (OB.method !== b.dataset.m) OB.stage = null; OB.method = b.dataset.m; renderOB(); break;
    case 'obstage': OB.stage = b.dataset.k; renderOB(); break;
    case 'obroast': DB.roastOnly = true; save(); $('#ob').classList.remove('on'); OB = null; goTab('torra'); renderAll(); break;
    case 'gotab': closeSheet(); goTab(b.dataset.v); break;
    case 'obfinish': { const L2 = buildLot(); DB.lots.push(L2); DB.active = L2.id; save(); $('#ob').classList.remove('on'); OB = null; guideMethod = null; renderAll(); window.scrollTo({ top:0 }); toast('Lote criado'); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target, L = lot();
  if (el.dataset.lot) { const k = el.dataset.lot; L[k] = k === 'cherryKg' ? (parseFloat(el.value) || null) : (el.value.trim() || L[k]); save(); renderAll(); }
  if (el.dataset.stageDate) {
    const k = el.dataset.stageDate, entry = L.log.find(x => x.k === k);
    if (!el.value) { el.value = entry.d; return; }
    const i = L.log.indexOf(entry), p = L.log[i - 1], n = L.log[i + 1];
    if ((p && el.value < p.d) || (n && el.value > n.d) || el.value > today()) { toast('Data fora da ordem das etapas'); el.value = entry.d; return; }
    entry.d = el.value; save(); renderAll(); toast('Data atualizada');
  }
  if (el.id === 'refIn') { const v = parseFloat(el.value); L.refWeight = v > 0 ? v : null; save(); renderPeso(); }
  if (el.id === 'obStageDate') { OB.stageDate = el.value || today(); if (OB.harvestDate > OB.stageDate) OB.harvestDate = OB.stageDate; renderOB(); }
  if (el.id === 'obHarvest') { OB.harvestDate = el.value || OB.harvestDate; renderOB(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'noteIn') { const L = lot(), d = el.dataset.d; if (el.value.trim()) L.notes[d] = el.value; else delete L.notes[d]; save(); }
  if (el.id === 'obName') { OB.name = el.value; const btn = $('#ob [data-act=obnext]'); if (btn) btn.disabled = !el.value.trim(); }
  if (el.id === 'obKg') OB.cherryKg = el.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('wIn')) e.target.parentElement.parentElement.querySelector('[data-act=saveweigh]')?.click();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.day[role=button]')) { e.preventDefault(); e.target.click(); }
});
$('#scrim').addEventListener('click', closeSheet);

// sem zoom: bloqueia gesto de pinça (Safari) e toque duplo
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive:false });
let lastTouch = 0, tx = 0, ty = 0, moved = false;
document.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; moved = false; }, { passive:true });
document.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.abs(t.clientX - tx) > 8 || Math.abs(t.clientY - ty) > 8) moved = true; }, { passive:true });
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (!moved && now - lastTouch < 350 && e.changedTouches.length === 1 && !e.target.closest('input, textarea, select')) {
    e.preventDefault(); // impede o zoom do toque duplo, mas mantém o toque funcionando
    e.target.closest('[data-act], [data-r], .tab, label')?.click();
  }
  lastTouch = moved ? 0 : now;
}, { passive:false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive:false });

// arrastar para baixo fecha a sheet
(() => { const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; } }, { passive:true });
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive:true });
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
})();

// tabs
function goTab(v) { const t = document.querySelector(`.tab[data-v="${v}"]`); if (t) t.click(); }
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t.dataset.v));
  window.scrollTo({ top:0 });
  if (t.dataset.v === 'cal') { const el = $('#v-cal .day.today'); if (el) { const y = el.getBoundingClientRect().top + scrollY - innerHeight * .35; window.scrollTo({ top:Math.max(0, y) }); } }
}));
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive:true });

function emptyLot(where) {
  return `<div class="empty-state"><h3>Nenhum lote em andamento</h3><p>${where}</p>
    <button class="btn" data-act="newlot">Começar um lote</button><button class="rz-link" data-act="gotab" data-v="torra">Ir para a torra</button></div>`;
}
function renderAll() {
  const L = lot(), y = scrollY;
  $('#lotName').textContent = L ? L.name + (L.archived ? ' · arquivado' : '') : 'Sem lote';
  $('[data-act=settings]').style.visibility = L ? '' : 'hidden';
  if (L) { renderHoje(); renderCal(); renderPeso(); }
  else {
    $('#v-hoje').innerHTML = emptyLot('Um lote acompanha o café da colheita à torra: o que fazer a cada dia e quando avançar.');
    $('#v-cal').innerHTML = emptyLot('O calendário mostra as etapas do lote, dia a dia.');
    $('#v-peso').innerHTML = emptyLot('A pesagem acompanha a secagem de um lote.');
  }
  renderGuia();
  if (window.renderTorra) renderTorra();
  window.scrollTo(0, y);
}
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); renderAll(); } });

function applyTheme() {
  const t = DB.theme || 'auto', root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach((m, i) => {
    if (t === 'auto') { m.setAttribute('content', i ? '#1E140E' : '#F7F2EA'); m.setAttribute('media', `(prefers-color-scheme: ${i ? 'dark' : 'light'})`); }
    else { m.setAttribute('content', dark ? '#1E140E' : '#F7F2EA'); m.removeAttribute('media'); }
  });
}
applyTheme();
if (!DB.lots.length && !DB.roastOnly) startOnboarding(true);
else { if (!lot() && DB.lots.length) DB.active = DB.lots[0].id; save(); renderAll(); if (!DB.lots.length) goTab('torra'); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script src="roast.js"></script>
</body>
</html>
